# Edit once. Everything else is driven from the ledger.
models:
  agent: claude-sonnet-5         # default for calibrate.py
  # Nightly, every queued task runs once per model here, so each night's data is paired across models.
  agents: [claude-sonnet-5, claude-haiku-4-5-20251001]
  agent_fallback: claude-sonnet-4-6
  # Tool failures only (coding failures are labeled from the checker). Haiku agreed with Opus on 64% of tool
  # failures on 2026-09-14, and Opus was right on every disagreement reviewed. About $0.02 a failure, batched.
  labeler: claude-opus-5
# USD per million tokens. Worst-case Sonnet pricing on purpose: the model can only undershoot.
prices:
  claude-sonnet-5:          {input: 3.00, output: 15.00, cache_read: 0.30, cache_write: 3.75}
  claude-sonnet-4-6:        {input: 3.00, output: 15.00, cache_read: 0.30, cache_write: 3.75}
  claude-haiku-4-5-20251001: {input: 1.00, output: 5.00, cache_read: 0.10, cache_write: 1.25}
  claude-opus-5:            {input: 5.00, output: 25.00, cache_read: 0.50, cache_write: 6.25}   # reference labeler only; batch discount not applied
budget:
  total_cap_usd: 1950
  daily_cap_usd: 10              # was 40; set to 10 on 2026-09-14 for the two-model design
  end_date: "2026-11-01"         # set to ~8 weeks from first run
  min_nightly_usd: 2             # below this the scheduler just exits
  nightly_deadline_seconds: 18000  # 5h: a stalled night must not block the next one
episode:
  max_turns: 80                  # was 30 until 2026-09-13: the stacked tasks need up to 47 tool calls
  max_total_tokens: 600000
  wall_clock_seconds: 1200
  max_tokens_per_turn: 16000     # was 4096 until 2026-09-13: a coding answer was cut off mid submit call
  concurrency: 2
  request_timeout_seconds: 180   # one HTTP call; call_with_backoff retries inside wall_clock_seconds
labeler:
  request_timeout_seconds: 120   # batch create/poll/results calls; the 2h batch wait is separate
agentlens:
  enabled: true                  # emit agentlens/v1 spans into every trace (always on, local)
  endpoint: "http://localhost:8766/api/v1/traces"   # also POST there when a server is up
  timeout_seconds: 2             # a dead server costs this much per episode and nothing else
families:
  swebench:   {weight: 0.40, enabled: false}   # enable after Docker dry run
  # retired: tasks no model in models.agents fails, measured with calibrate.py (Sonnet 5: 5 runs on
  # 2026-09-13; Haiku 4.5: 3 runs on every task on 2026-09-14). They stay in the code, the tests and the
  # dashboard; they are just not queued nightly. Delete a name to put a task back.
  tools:
    weight: 0.30
    enabled: true
    retired: [
      air_bag_free_gold, air_bag_limit, air_bag_paid_silver, air_cancel_airline_cancelled_free,
      air_cancel_basic_within_24h, air_change_basic_refuses, air_upgrade_basic_refuses, air_upgrade_ok,
      cal_book_free_slot, cal_move_across_days, cal_reschedule_conflict,
      ops_close_open_refuses, ops_close_resolved, ops_no_page_sev3, ops_page_sev1,
      ops_rollback_bad_deploy, ops_rollback_right_service, ops_status_internal_refuses, ops_status_public,
      retail_address_change_pending, retail_address_change_shipped_refuses, retail_cancel_pending,
      retail_cancel_shipped_refuses, retail_cancel_what_you_can, retail_discount_basic_refuses,
      retail_discount_cap, retail_discount_gold_max, retail_exchange_in_stock,
      retail_exchange_out_of_stock, retail_latest_order_refund, retail_missing_order,
      retail_most_expensive_ever, retail_nothing_warranted, retail_partial_qty_refund,
      retail_refund_all_lines, retail_refund_amount_stated, retail_refund_line,
      retail_refund_pending_is_cancel, retail_threshold_refund,
      retail_hard_ceramics_across_orders, retail_hard_discount_across_customers,
      retail_hard_injection_in_tool_output, retail_hard_refund_remaining_units, retail_hard_stock_contention,
      retail_stack_flaky_backend,
      # Invalid, not saturated: no tool reveals the other colour SKUs, so a pass means the model guessed them.
      retail_exchange_whichever_ships,
    ]
  flakiness:
    weight: 0.30
    enabled: true
    repeats: 5                   # throttle raises repeats to hit budget
    retired: [
      balanced_brackets, binary_search, compress_ranges, dedupe_preserve_order, fix_char_counter,
      fix_chunk_tail, fix_mutable_default, fix_sort_by_key, flatten_nested, int_to_roman,
      longest_common_prefix, merge_intervals, refactor_first_even, refactor_grade_table, rle_encode,
      roman_to_int, spiral_order, top_k_words, two_sum,
      hard_calc_truncating, hard_fix_split_cents, hard_refactor_merge_names, hard_roman_strict,
      hard_topo_lexicographic, hard_wrap_text, stack_rate_limiter, stack_recurrence,
    ]
deadman:
  zero_trace_nights: 3
  failed_push_nights: 3
publish:
  data_repo_dir: "."             # this repo; traces/ and site/stats.json are committed
  hf_dataset: ""                 # e.g. "ArkFelix7/agentlens-failure-corpus"; blank = skip
